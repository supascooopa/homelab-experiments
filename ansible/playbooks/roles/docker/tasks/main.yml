---
- name: prepare docker
  block: 
    - name: check if docker is installed
      command: docker --version
      register: docker_installed
      ignore_errors: yes
    - name: debug Docker Output
      debug:
        var: docker_installed
      when : docker_installed.failed 
    - name: update docker file
      copy:
        src: ~/homelab_portfolio/ansible/Dockerfile
        dest: ~/homelab_portfolio/
      when: not docker_installed.failed
